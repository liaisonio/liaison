manager:
  listen:
    addr: 0.0.0.0:8080
    network: tcp
    tls:
      enable: false
  db: /opt/liaison/data/liaison.db
  jwt_secret: "" # Set in your ignored *.local.yaml configuration.
  ssh_host_key_file: /opt/liaison/data/ssh_host_ed25519_key
  ssh_idle_timeout: 30m
  ssh_max_duration: 8h
  guacd_addr: 127.0.0.1:4822
  guacd_bridge_addr: 127.0.0.1:0
  guacd_bridge_host: 127.0.0.1
  agent:
    enabled: false
    base_url: https://api.openai.com/v1
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    request_timeout: 2m
    max_model_steps: 12
    approval_expiry: 15m
frontier:
  dial:
    addrs:
      - 127.0.0.1:30011
    network: tcp
    tls:
      enable: false
log:
  level: debug
  file: /opt/liaison/logs/liaison.log
  maxsize: 100
  maxrolls: 10
