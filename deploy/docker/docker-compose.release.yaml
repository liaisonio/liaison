services:
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: liaison-guacd
    restart: unless-stopped
    network_mode: host
    command: /bin/sh -c '/opt/guacamole/sbin/guacd -b 127.0.0.1 -l 4822 -L "$${GUACD_LOG_LEVEL:-info}" -f'

  frontier:
    image: ${LIAISON_IMAGE_REGISTRY:-liaison}/frontier:${LIAISON_IMAGE_TAG:-latest}
    container_name: liaison-frontier
    restart: unless-stopped
    network_mode: host
    environment:
      FRONTIER_PORT: ${FRONTIER_PORT:-30012}
      FRONTIER_CONTROLPLANE_PORT: ${FRONTIER_CONTROLPLANE_PORT:-30010}
    volumes:
      - ./certs:/opt/liaison/certs

  liaison:
    image: ${LIAISON_IMAGE_REGISTRY:-liaison}/liaison:${LIAISON_IMAGE_TAG:-latest}
    container_name: liaison-manager
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - frontier
      - guacd
    environment:
      LIAISON_PUBLIC_HOST: ${LIAISON_PUBLIC_HOST:-localhost}
      MANAGER_PORT: ${MANAGER_PORT:-443}
      FRONTIER_PORT: ${FRONTIER_PORT:-30012}
      FRONTIER_CONTROLPLANE_PORT: ${FRONTIER_CONTROLPLANE_PORT:-30010}
      LIAISON_ADMIN_EMAIL: ${LIAISON_ADMIN_EMAIL:-default@liaison.com}
      JWT_SECRET: ${JWT_SECRET:-}
      GUACD_ADDR: ${GUACD_ADDR:-127.0.0.1:4822}
      GUACD_BRIDGE_ADDR: ${GUACD_BRIDGE_ADDR:-127.0.0.1:0}
      GUACD_BRIDGE_HOST: ${GUACD_BRIDGE_HOST:-127.0.0.1}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4.1-mini}
      AGENT_REQUEST_TIMEOUT: ${AGENT_REQUEST_TIMEOUT:-2m}
      AGENT_MAX_MODEL_STEPS: ${AGENT_MAX_MODEL_STEPS:-12}
      AGENT_APPROVAL_EXPIRY: ${AGENT_APPROVAL_EXPIRY:-15m}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: override the URL the Web console advertises for itself.
      # SERVER_URL: "https://${LIAISON_PUBLIC_HOST}"
    volumes:
      - ./data:/opt/liaison/data
      - ./certs:/opt/liaison/certs
      - ./logs:/opt/liaison/logs
