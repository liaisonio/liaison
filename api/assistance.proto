syntax = "proto3";
package liaison.assistance.v1;
option go_package = "github.com/liaisonio/liaison/api/assistance/v1";
// JSON HTTP contract: POST /api/v1/assistance/suggestions.
// DELETE at the same path releases this editor's in-memory session.
// HTTP 400: invalid editing input. HTTP 502: invalid model suggestion.
message SuggestRequest {
  string handle_id = 1;
  string editor_id = 2;
  uint64 revision = 3;
  string text = 4;
  uint32 cursor = 5; // UTF-8 byte offset.
  // WebSSH only: "none" (default, draft + completed Shell Agent conclusions),
  // "commands" (also cwd/recent commands),
  // "output" (also bounded recent command output). Explicit sharing consent.
  // Context contents are resolved server-side, never supplied by the client.
  string context_mode = 6;
  // WebSSH: the same Shell Agent session used by terminal analysis.
  // Ownership and the live connection binding are checked server-side.
  string agent_session_id = 7;
}
message SuggestResponse {
  uint64 revision = 1;
  uint32 cursor = 2;
  string text = 3;
}
