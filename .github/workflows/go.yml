name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release workflow
        run: |
          bash -n scripts/resolve-release-version.sh scripts/sync-release-version.sh scripts/test-release-version.sh
          scripts/test-release-version.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev libsqlite3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          for pkg in $(go list ./...); do
            if [[ ! "$pkg" =~ test/e2e ]]; then
              go test -race -timeout 120s "$pkg"
            fi
          done

  web-build:
    name: web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/liaison-browser-tests --no-audit --no-fund playwright@1.58.2
          /tmp/liaison-browser-tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Core browser regression
        env:
          PLAYWRIGHT_MODULE: /tmp/liaison-browser-tests/node_modules/playwright
        run: bash e2e/run-core.sh

      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-screenshots
          path: |
            /tmp/models-*.png
            /tmp/session-model-*.png
            /tmp/liaison-shell-*.png
            /tmp/product-polish-*.png
            /tmp/agent-*.png
            /tmp/liaison-edge-agent-*.png
            /tmp/access-*.png
            /tmp/llm-*.png
